kind = "web"
previewPath = "/"
title = "CP Companion"
version = "1.0.0"
id = "artifacts/cp-companion"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24252

[services.development]
run = "pnpm --filter @workspace/cp-companion run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/cp-companion", "run", "build" ]
serve = "static"
publicDir = "artifacts/cp-companion/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24252"
BASE_PATH = "/"
