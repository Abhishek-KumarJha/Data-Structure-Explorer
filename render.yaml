services:
  # ─── Backend API Web Service ────────────────────────────────────────────────
  - type: web
    name: cp-companion-api
    env: node
    plan: free
    rootDir: artifacts/api-server
    buildCommand: pnpm install
    startCommand: npx tsx src/index.ts
    envVars:
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: cp-companion-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

  # ─── Frontend Static Site ──────────────────────────────────────────────────
  - type: web
    name: cp-companion-web
    env: static
    plan: free
    rootDir: artifacts/cp-companion
    buildCommand: pnpm install && pnpm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  # ─── PostgreSQL Database ────────────────────────────────────────────────────
  - name: cp-companion-db
    databaseName: cp_companion
    user: cp_user
    plan: free
