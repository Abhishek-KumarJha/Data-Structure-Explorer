services:
  # ─── Backend API Web Service ────────────────────────────────────────────────
  - type: web
    name: cp-companion-api
    env: node
    plan: free
    rootDir: .
    buildCommand: npx pnpm install --ignore-scripts
    startCommand: npx tsx artifacts/api-server/src/index.ts
    envVars:
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: cp-companion-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

  # ─── Frontend Static Site ──────────────────────────────────────────────────
  - type: web
    name: cp-companion-web
    env: static
    rootDir: .
    buildCommand: npx pnpm install --ignore-scripts && pnpm --filter @workspace/cp-companion run build
    staticPublishPath: artifacts/cp-companion/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: cp-companion-api
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  # ─── PostgreSQL Database ────────────────────────────────────────────────────
  - name: cp-companion-db
    databaseName: cp_companion
    user: cp_user
    plan: free
